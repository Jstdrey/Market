services:
  market:
    container_name: market-app
    build:
      context: ..
      dockerfile: Dockerfile
    image: market-app:${MARKET_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      TZ: ${TZ:-Europe/Moscow}
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: ${STREAMLIT_SERVER_PORT:-8501}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${MARKET_PUBLIC_PORT:-8501}:${STREAMLIT_SERVER_PORT:-8501}"
    volumes:
      - ${MARKET_RUNTIME_DIR:-./runtime}/data_cache:/app/data/cache
      - ${MARKET_RUNTIME_DIR:-./runtime}/output:/app/output
      - ${MARKET_RUNTIME_DIR:-./runtime}/state/strategy_profiles.json:/app/strategy_profiles.json
      - ${MARKET_RUNTIME_DIR:-./runtime}/state/data.csv:/app/data.csv
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${STREAMLIT_SERVER_PORT:-8501}/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
